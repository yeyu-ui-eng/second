version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sales-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "file:./data/prod.db"
      JWT_SECRET: "production-jwt-secret-change-this-in-real-deployment"
      JWT_REFRESH_SECRET: "production-refresh-secret-change-this-in-real-deployment"
      JWT_EXPIRES_IN: "24h"
      JWT_REFRESH_EXPIRES_IN: "7d"
      NODE_ENV: production
      PORT: 5000
      CORS_ORIGIN: "http://localhost:80"
    ports:
      - "5000:5000"
    volumes:
      - sqlite_data:/app/backend/data

  nginx:
    image: nginx:alpine
    container_name: sales-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend

volumes:
  sqlite_data:
