version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sales-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sales_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sales-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/sales_platform?schema=public"
      JWT_SECRET: "production-jwt-secret-change-this-in-real-deployment"
      JWT_REFRESH_SECRET: "production-refresh-secret-change-this-in-real-deployment"
      JWT_EXPIRES_IN: "24h"
      JWT_REFRESH_EXPIRES_IN: "7d"
      NODE_ENV: production
      PORT: 5000
      CORS_ORIGIN: "http://localhost:80"
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/uploads
    command: >
      sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/app.js"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sales-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    environment:
      VITE_API_URL: "http://localhost:5000/api"

  nginx:
    image: nginx:alpine
    container_name: sales-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  uploads:
